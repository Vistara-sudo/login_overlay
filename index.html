<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2><span class="plane-icon"> 🩸</span>Blood donor</h2>
            </div>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="booking.html">BOOKING</a></li>
                <li><a href="profile.html">PROFILE</a></li>
                <li><a href="about.html">ABOUT</a></li>

            </ul>
                <div class="authentication" id="authButtons">
                    <button type="button" class="submission" id="signupBtn">Signup</button>
                    <button type="button" class="submission" id="loginBtn">Login</button>
                </div>
        </nav>
    </header>

    <!-- Signup overlay -->
    <div class="modal-overlay">

        <div class="signup-modal">
            <button class="close-modal" id="closeModal">
                    ✕
            </button>
            <h2>Create your account</h2>
            <form id="signupForm">

                <div class="signup-field">
                    <input type="text" id="fullname" placeholder="Full Name">
                </div>

                <div class="signup-field">
                    <input type="email" id="email" placeholder="Email">
                </div>

                <div class="signup-field">
                    <input type="password" id="password" placeholder="Password">
                </div>

                <div class="signup-field">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                </div>

                <button type="submit" class="signup-submit">Create Account</button>

                <p class="switch-text">
                    Already have an account? 
                        <span id="openLogin">Login</span>
                </p>
            </form>
        </div>
    </div> 

    <div class="loginOverlay"> 
        
        <div class="loginModal">
            <button class="closeLogin-modal" >
                ✕
            </button>
            <h2>Login</h2>
            <form id="loginForm">
                
                <div class="signup-field">
                    <input type="email" placeholder="Email Address" required>
                </div>
                
                <div class="signup-field">
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="signup-submit">
                    Login
                </button>

                <p class="switch-text">
                    Don't have an Account?
                    <span id="openSignup">Sign Up</span>
                </p>
            </form>
        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
